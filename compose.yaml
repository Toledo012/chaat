# Producción — SEMAHN Tickets (https://semahnchiapas.com.mx/servicios)
# Requiere el proxy compartido arriba primero (docker/proxy → /var/www/proxy).
# Uso:  cp .env.docker.example .env  →  editar  →  docker compose up -d --build
name: semahn

services:
  app:
    build:
      context: .
      target: app
    image: semahn-app:prod
    restart: always
    env_file: .env
    volumes:
      - storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      target: web
    image: semahn-web:prod
    restart: always
    # SIN "ports": solo Caddy (proxy) recibe tráfico de internet.
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      internal:
      proxy:
        aliases: [semahn-tickets]   # Caddy lo encuentra con este nombre

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Mexico_City
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    # SIN "ports": la base solo es accesible desde la red interna de Docker.
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [internal]

volumes:
  dbdata:
  storage:

networks:
  internal:
    driver: bridge
  proxy:
    external: true   # la crea el proxy compartido
